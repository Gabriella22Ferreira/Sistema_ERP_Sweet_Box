<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - SweetBox</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="login-container">
        <div style="max-width: 450px; width: 100%;">
            <div class="text-center mb-4">
                <div class="login-logo">👤</div>
                <h1 style="font-size: 2rem; font-weight: 700; color: var(--foreground); margin-bottom: 0.5rem;">Criar Conta</h1>
                <p style="color: var(--muted-foreground);">SweetBox - Sistema de Gestão</p>
            </div>
            <div class="login-card">
                <form th:action="@{/cadastro}" method="get" id="cadastroForm">
                    <div class="form-group">
                        <label class="form-label">Tipo de Usuário</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button type="button" class="btn btn-outline" id="btnGestor" onclick="selecionarTipo('gestor')">
                                <i data-lucide="shield" class="icon"></i> Gestor
                            </button>
                            <button type="button" class="btn btn-primary" id="btnFuncionario" onclick="selecionarTipo('funcionario')">
                                <i data-lucide="user" class="icon"></i> Funcionário
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Nome Completo</label>
                        <input type="text" id="nome" class="form-input" placeholder="Seu nome completo" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-input" placeholder="seu@email.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Senha</label>
                        <input type="password" id="senha" class="form-input" placeholder="••••••••" required>
                    </div>
                    <div id="requisitosContainer" style="display: none;" class="card mb-3">
                        <p style="font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem;">Requisitos da senha:</p>
                        <div style="display: flex; flex-direction: column; gap: 0.25rem;">
                            <div id="req-tamanho" style="font-size: 0.875rem; color: var(--muted-foreground);">
                                <i data-lucide="circle" class="icon" style="width: 16px; height: 16px;"></i> Mínimo 8 caracteres
                            </div>
                            <div id="req-maiuscula" style="font-size: 0.875rem; color: var(--muted-foreground);">
                                <i data-lucide="circle" class="icon" style="width: 16px; height: 16px;"></i> Letra maiúscula
                            </div>
                            <div id="req-minuscula" style="font-size: 0.875rem; color: var(--muted-foreground);">
                                <i data-lucide="circle" class="icon" style="width: 16px; height: 16px;"></i> Letra minúscula
                            </div>
                            <div id="req-numero" style="font-size: 0.875rem; color: var(--muted-foreground);">
                                <i data-lucide="circle" class="icon" style="width: 16px; height: 16px;"></i> Número
                            </div>
                            <div id="req-especial" style="font-size: 0.875rem; color: var(--muted-foreground);">
                                <i data-lucide="circle" class="icon" style="width: 16px; height: 16px;"></i> Caractere especial (!@#$%^&*)
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirmar Senha</label>
                        <input type="password" id="confirmarSenha" class="form-input" placeholder="••••••••" required>
                    </div>
                    <div id="errorMessage" class="alert alert-error hidden"></div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Criar Conta</button>
                </form>
                <div class="text-center mt-4">
                    <p style="font-size: 0.875rem; color: var(--muted-foreground);">
                        Já tem uma conta?
                        <a href="index.html" style="color: var(--primary); font-weight: 500; text-decoration: none;">Faça login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script>
        lucide.createIcons();
        let tipoSelecionado = 'funcionario';
        function selecionarTipo(tipo) {
            tipoSelecionado = tipo;
            document.getElementById('btnGestor').className = tipo === 'gestor' ? 'btn btn-primary' : 'btn btn-outline';
            document.getElementById('btnFuncionario').className = tipo === 'funcionario' ? 'btn btn-primary' : 'btn btn-outline';
            lucide.createIcons();
        }
        document.getElementById('senha').addEventListener('input', function() {
            const senha = this.value;
            const container = document.getElementById('requisitosContainer');
            if (senha) {
                container.style.display = 'block';
                const requisitos = validarSenhaForte(senha);
                for (const [key, value] of Object.entries(requisitos)) {
                    const elem = document.getElementById('req-' + key);
                    const icon = elem.querySelector('i');
                    if (value) {
                        elem.style.color = '#10b981';
                        icon.setAttribute('data-lucide', 'check-circle');
                    } else {
                        elem.style.color = 'var(--muted-foreground)';
                        icon.setAttribute('data-lucide', 'circle');
                    }
                }
                lucide.createIcons();
            } else {
                container.style.display = 'none';
            }
        });
        document.getElementById('cadastroForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const confirmarSenha = document.getElementById('confirmarSenha').value;
            const errorDiv = document.getElementById('errorMessage');
            if (!nome || !email || !senha || !confirmarSenha) {
                errorDiv.textContent = 'Preencha todos os campos';
                errorDiv.classList.remove('hidden');
                return;
            }
            if (!senhaEhForte(senha)) {
                errorDiv.textContent = 'A senha não atende aos requisitos de segurança';
                errorDiv.classList.remove('hidden');
                return;
            }
            if (senha !== confirmarSenha) {
                errorDiv.textContent = 'As senhas não coincidem';
                errorDiv.classList.remove('hidden');
                return;
            }
            if (cadastrarUsuario(nome, email, senha, tipoSelecionado)) {
                alert('Cadastro realizado com sucesso! Faça login para continuar.');
                window.location.href = 'index.html';
            } else {
                errorDiv.textContent = 'Email já cadastrado';
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>

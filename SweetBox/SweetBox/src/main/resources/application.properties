spring.application.name=SweetBox


# ===============================
# CONFIGURAÇÕES DO MYSQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/sweetbox?useTimezone=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=2456

# ===============================
# CONFIGURAÇÕES DO HIBERNATE (JPA)
# ===============================
spring.jpa.show-sql=true

#faz o Spring ler as suas classes Java (@Entity)
# e criar as tabelas no MySQL se elas não existirem.
spring.jpa.hibernate.ddl-auto=update



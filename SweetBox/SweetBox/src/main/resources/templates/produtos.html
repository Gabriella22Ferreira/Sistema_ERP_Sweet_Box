<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos - SweetBox</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="page-wrapper">
        <nav class="navbar">
            <div class="navbar-content">
                <a href="#" class="navbar-brand">
                    <div class="navbar-logo">🍬</div>
                    <div class="navbar-brand-text"><h1>SweetBox</h1><p>Sistema de Gestão</p></div>
                </a>
                <ul class="navbar-menu" id="navMenu"></ul>
                <div class="navbar-user">
                    <div class="navbar-user-info" id="userInfo"></div>
                    <div class="navbar-avatar">👤</div>
                    <button class="btn-logout" onclick="logout()"><i data-lucide="log-out" class="icon"></i></button>
                </div>
            </div>
        </nav>
        <main class="main-content">
            <div class="container">
                <div class="flex-between mb-4">
                    <div>
                        <h2 style="font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem;">Produtos</h2>
                        <p style="color: var(--muted-foreground);">Gerencie seu estoque de doces</p>
                    </div>
                    <button class="btn btn-primary" onclick="abrirModal()">
                        <i data-lucide="plus" class="icon"></i> Novo Produto
                    </button>
                </div>
                <div class="card mb-3">
                    <input type="text" id="busca" class="form-input" placeholder="Buscar produtos..." oninput="filtrarProdutos()">
                </div>
                <div class="grid grid-cols-lg-3 gap-2" id="listaProdutos"></div>
            </div>
        </main>
    </div>
    <div class="modal-overlay" id="modalProduto">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitulo">Novo Produto</h3>
                <button class="modal-close" onclick="fecharModal()">×</button>
            </div>
            <form id="produtoForm">
                <div class="form-group">
                    <label class="form-label">Nome *</label>
                    <input type="text" id="nome" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Descrição</label>
                    <textarea id="descricao" class="form-textarea" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Categoria</label>
                    <input type="text" id="categoria" class="form-input" placeholder="Ex: Chocolates, Balas...">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div class="form-group">
                        <label class="form-label">Preço (R$) *</label>
                        <input type="number" step="0.01" id="preco" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Quantidade *</label>
                        <input type="number" id="quantidade" class="form-input" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Estoque Mínimo</label>
                    <input type="number" id="estoqueMinimo" class="form-input" placeholder="5">
                </div>
                <div class="flex gap-2 mt-4">
                    <button type="button" class="btn btn-outline" style="flex: 1;" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Salvar</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/produtos.js"></script>
    <script>verificarAutenticacao(); carregarPagina();</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos - SweetBox</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="page-wrapper">
        <nav class="navbar">
            <div class="navbar-content">
                <a href="#" class="navbar-brand">
                    <div class="navbar-logo">🍬</div>
                    <div class="navbar-brand-text"><h1>SweetBox</h1><p>Sistema de Gestão</p></div>
                </a>
                <ul class="navbar-menu" id="navMenu">
                    <nav style="display: flex; justify-content: center; gap: 0.5rem; padding-top: 1rem;">

                        <a th:if="${session.usuarioLogado != null && session.usuarioLogado.tipoUsuario == 'gestor'}" th:href="@{/dashboard}" style="display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem; text-decoration: none; color: var(--foreground); border-radius: 8px; transition: background 0.2s;" onmouseover="this.style.background='rgba(0,0,0,0.05)'" onmouseout="this.style.background='transparent'">
                            <i data-lucide="layout-dashboard" style="width: 20px; height: 20px;"></i>
                            <span style="font-weight: 500;">Dashboard</span>
                        </a>

                        <a th:href="@{/vendas}" style="display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem; text-decoration: none; color: var(--foreground); border-radius: 8px; transition: background 0.2s;" onmouseover="this.style.background='rgba(0,0,0,0.05)'" onmouseout="this.style.background='transparent'">
                            <i data-lucide="shopping-cart" style="width: 20px; height: 20px;"></i>
                            <span style="font-weight: 500;">Vendas</span>
                        </a>

                        <a th:href="@{/produtos}" style="display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem; text-decoration: none; color: var(--foreground); border-radius: 8px; transition: background 0.2s;" onmouseover="this.style.background='rgba(0,0,0,0.05)'" onmouseout="this.style.background='transparent'">
                            <i data-lucide="package" style="width: 20px; height: 20px;"></i>
                            <span style="font-weight: 500;">Produtos</span>
                        </a>

                        <a th:if="${session.usuarioLogado != null && session.usuarioLogado.tipoUsuario == 'gestor'}" th:href="@{/estoque}" style="display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem; text-decoration: none; color: var(--foreground); border-radius: 8px; transition: background 0.2s;" onmouseover="this.style.background='rgba(0,0,0,0.05)'" onmouseout="this.style.background='transparent'">
                            <i data-lucide="boxes" style="width: 20px; height: 20px;"></i>
                            <span style="font-weight: 500;">Estoque</span>
                        </a>

                        <hr style="border: 0; border-top: 1px solid var(--border); margin: 1rem 0;">

                    </nav>
                </ul>
                <div class="navbar-user">
                    <div class="navbar-user-info" id="userInfo">
                        <span th:text="${session.usuarioLogado != null ? session.usuarioLogado.nomeCompletoUsuario : 'Usuário'}">
                            Nome do Figma
                        </span>
                    </div>
                    <div class="navbar-avatar">👤</div>
                    <button class="btn-logout" onclick="logout()"><i data-lucide="log-out" class="icon"></i></button>
                </div>
            </div>
        </nav>
        <main class="main-content">
            <div class="container">
                <div class="flex-between mb-4">
                    <div>
                        <h2 style="font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem;">Produtos</h2>
                        <p style="color: var(--muted-foreground);">Gerencie seu estoque de doces</p>
                    </div>
                    <button class="btn btn-primary" onclick="abrirModal()">
                        <i data-lucide="plus" class="icon"></i> Novo Produto
                    </button>
                </div>
                <div class="card mb-3">
                    <input type="text" id="busca" class="form-input" placeholder="Buscar produtos..." oninput="filtrarProdutos()">
                </div>
                <div class="grid grid-cols-lg-3 gap-2" id="listaProdutos">
                    <div class="grid-lista">

                        <div th:if="${#lists.isEmpty(produtos)}" class="card text-center" style="grid-column: 1 / -1; padding: 3rem;">
                            <i data-lucide="package" class="icon-xl" style="margin: 0 auto 1rem; color: var(--muted-foreground);"></i>
                            <p style="color: var(--muted-foreground);">Nenhum produto encontrado no banco de dados.</p>
                        </div>

                        <div th:each="p : ${produtos}" class="card">
                            <div class="flex-between mb-3">
                                <div style="flex: 1;">
                                    <h4 style="font-weight: 600; margin-bottom: 0.25rem;" th:text="${p.nomeProduto}">Nome do Produto</h4>
                                    <span class="badge badge-primary" th:if="${p.categoria != null}" th:text="${p.categoria}">Categoria</span>
                                </div>

                                <div class="flex gap-1">
                                    <button class="btn btn-outline" style="padding: 0.5rem;">
                                        <i data-lucide="pencil" class="icon" style="width: 16px; height: 16px;"></i>
                                    </button>

                                    <button class="btn btn-outline" style="padding: 0.5rem; color: var(--destructive);">
                                        <i data-lucide="trash-2" class="icon" style="width: 16px; height: 16px;"></i>
                                    </button>
                                </div>
                            </div>

                            <p style="font-size: 0.875rem; color: var(--muted-foreground); margin-bottom: 1rem;" th:text="${p.descricao}">Descrição do produto</p>

                            <div style="display: flex; flex-direction: column; gap: 0.5rem;">
                                <div class="flex-between" style="font-size: 0.875rem;">
                                    <span style="color: var(--muted-foreground);">Preço:</span>
                                    <span style="font-weight: 600; color: var(--primary);" th:text="'R$ ' + ${p.valorUnidade}">R$ 0,00</span>
                                </div>

                                <div class="flex-between" style="font-size: 0.875rem;">
                                    <span style="color: var(--muted-foreground);">Estoque:</span>
                                    <span style="font-weight: 600;" th:style="${p.quantidadeProduto <= p.estoqueMin} ? 'color: var(--destructive);' : 'color: var(--foreground);'" th:text="${p.quantidadeProduto} + ' un.'">
                    0 un.
                </span>
                                </div>

                                <div th:if="${p.quantidadeProduto <= p.estoqueMin}" class="badge badge-danger" style="width: 100%; text-align: center;">
                                    Estoque baixo!
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div class="modal-overlay" id="modalProduto" th:classappend="${mensagemErro != null} ? 'active' : ''">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitulo">Novo Produto</h3>
                <button class="modal-close" onclick="fecharModal()">×</button>
            </div>
            <form id="produtoForm" method="POST" th:action="@{/produtos/cadastrar}" novalidate>

                <div th:if="${mensagemErro}" style="color: red; margin-bottom: 1rem; font-weight: bold;">
                    <p th:text="${mensagemErro}"></p>
                </div>

                <div class="form-group">
                    <label class="form-label">Nome *</label>
                    <input type="text" id="nome" name="nomeProduto" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Descrição</label>
                    <textarea id="descricao" name="descricao" class="form-textarea" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">Categoria</label>
                    <input type="text" id="categoria" name="categoria" class="form-input" placeholder="Ex: Chocolates, Balas...">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div class="form-group">
                        <label class="form-label">Preço (R$) *</label>
                        <input type="number" name="valorUnidade" step="0.01" id="preco" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Quantidade *</label>
                        <input type="number" name="quantidadeProduto" id="quantidade" class="form-input" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Estoque Mínimo</label>
                    <input type="number" id="estoqueMinimo"  name="estoqueMin" class="form-input" placeholder="5">
                </div>
                <div class="flex gap-2 mt-4">
                    <button type="button" class="btn btn-outline" style="flex: 1;" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/produtos.js"></script>
    <script>lucide.createIcons(); carregarMenu();</script>

</body>
</html>

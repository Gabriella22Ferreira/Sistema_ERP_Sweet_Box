<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SweetBox</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="login-container">
        <div style="max-width: 450px; width: 100%;">
            <div class="text-center mb-4">
                <div class="login-logo">🍬</div>
                <h1 style="font-size: 2rem; font-weight: 700; color: var(--foreground); margin-bottom: 0.5rem;">SweetBox</h1>
                <p style="color: var(--muted-foreground);">Sistema de Gestão</p>
            </div>

            <div class="login-card">
                <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem;">Login</h2>
                <form id="loginForm" th:action="@{/login}" method="POST">
                    <div th:if="${param.sucesso}" style="display: flex; align-items: center; gap: 0.5rem; background-color: #dcfce7; color: #166534; padding: 0.75rem 1rem; border-radius: 12px; margin-bottom: 1.5rem; font-size: 0.875rem; border: 1px solid #bbf7d0;">
                        <i data-lucide="check-circle" style="width: 18px; height: 18px;"></i>
                        <span>Cadastro realizado com sucesso! Faça login para continuar.</span>
                    </div>
                    <div th:if="${erroLogin}" class="alert alert-error" style="display: flex; align-items: center; gap: 0.5rem; background-color: #fee2e2; color: #991b1b; padding: 0.75rem 1rem; border-radius: 12px; margin-bottom: 1.5rem; border: 1px solid #fca5a5;">
                        <i data-lucide="alert-circle" style="width: 18px; height: 18px;"></i>
                        <span th:text="${erroLogin}">Erro</span>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <div class="form-input-icon">
                            <i data-lucide="mail" class="icon"></i>
                            <input type="email" id="email"  name="email" class="form-input" placeholder="seu@email.com" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Senha</label>
                        <div class="form-input-icon">
                            <i data-lucide="lock" class="icon"></i>
                            <input type="password" id="senha" name="senha" class="form-input" placeholder="••••••••" required>
                            <button type="button" id="togglePassword" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted-foreground);">
                                <i data-lucide="eye" class="icon" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>
                    <div id="errorMessage" class="alert alert-error hidden"></div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>
                </form>

                <div class="text-center mt-4">
                    <p style="font-size: 0.875rem; color: var(--muted-foreground);">
                        Esqueceu sua Senha? Ligue para +55 (11) 95991-1849
<!--                        <a th:href="@{/cadastro}" style="color: var(&#45;&#45;primary); font-weight: 500; text-decoration: none;">Cadastre-se</a>-->
                    </p>
                </div>
            </div>
        </div>
    </div>
    <script src="js/all.js"></script>
    <script>lucide.createIcons();</script>
</body>
</html>

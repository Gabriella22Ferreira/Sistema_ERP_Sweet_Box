<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SweetBox</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="login-container">
        <div style="max-width: 450px; width: 100%;">
            <div class="text-center mb-4">
                <div class="login-logo">🍬</div>
                <h1 style="font-size: 2rem; font-weight: 700; color: var(--foreground); margin-bottom: 0.5rem;">SweetBox</h1>
                <p style="color: var(--muted-foreground);">Sistema de Gestão</p>
            </div>

            <div class="login-card">
                <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem;">Login</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <div class="form-input-icon">
                            <i data-lucide="mail" class="icon"></i>
                            <input type="email" id="email" class="form-input" placeholder="seu@email.com" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Senha</label>
                        <div class="form-input-icon">
                            <i data-lucide="lock" class="icon"></i>
                            <input type="password" id="senha" class="form-input" placeholder="••••••••" required>
                            <button type="button" id="togglePassword" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted-foreground);">
                                <i data-lucide="eye" class="icon" id="eyeIcon"></i>
                            </button>
                        </div>
                    </div>
                    <div id="errorMessage" class="alert alert-error hidden"></div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>
                </form>
                <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border);">
                    <p style="font-size: 0.875rem; color: var(--muted-foreground); margin-bottom: 0.75rem;">Login rápido para teste:</p>
                    <div class="grid grid-cols-2 gap-2">
                        <button type="button" class="btn btn-secondary" onclick="loginRapido('gestor')">Gestor</button>
                        <button type="button" class="btn btn-secondary" onclick="loginRapido('funcionario')">Funcionário</button>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <p style="font-size: 0.875rem; color: var(--muted-foreground);">
                        Não tem uma conta?
                        <a th:href="@{/cadastro}" style="color: var(--primary); font-weight: 500; text-decoration: none;">Cadastre-se</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script>
        lucide.createIcons();
        document.getElementById('togglePassword').addEventListener('click', function() {
            const senhaInput = document.getElementById('senha');
            const eyeIcon = document.getElementById('eyeIcon');
            if (senhaInput.type === 'password') {
                senhaInput.type = 'text';
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                senhaInput.type = 'password';
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        });
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const errorDiv = document.getElementById('errorMessage');
            if (!email || !senha) {
                errorDiv.textContent = 'Preencha todos os campos';
                errorDiv.classList.remove('hidden');
                return;
            }
            if (login(email, senha)) {
                const usuario = getUsuarioLogado();
                if (usuario.tipo === 'gestor') {
                    window.location.href = 'dashboard.html';
                } else {
                    window.location.href = 'vendas.html';
                }
            } else {
                errorDiv.textContent = 'Email ou senha incorretos';
                errorDiv.classList.remove('hidden');
            }
        });
        function loginRapido(tipo) {
            const emails = {
                gestor: 'gestor@sweetbox.com',
                funcionario: 'funcionario@sweetbox.com'
            };
            document.getElementById('email').value = emails[tipo];
            document.getElementById('senha').value = 'SweetBox@2024';
        }
    </script>
</body>
</html>

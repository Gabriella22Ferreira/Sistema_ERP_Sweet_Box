<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - SweetBox</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .input-error {
            border-color: #ef4444 !important;
            background-color: #fef2f2 !important;
        }
        .radio-escondido {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div style="max-width: 450px; width: 100%;">
            <div class="text-center mb-4">
                <div class="login-logo">👤</div>
                <h1 style="font-size: 2rem; font-weight: 700; color: var(--foreground); margin-bottom: 0.5rem;">Criar Conta</h1>
                <p style="color: var(--muted-foreground);">SweetBox - Sistema de Gestão</p>
            </div>
            <div class="login-card">
                <form th:action="@{/cadastro}" method="POST" id="cadastroForm">

                    <div th:if="${mensagemErro}" class="alert alert-error" style="display: flex; align-items: center; gap: 0.5rem; background-color: #fee2e2; color: #991b1b; padding: 0.75rem 1rem; border-radius: 12px; margin-bottom: 1.5rem; font-size: 0.875rem; border: 1px solid #fca5a5;">
                        <i data-lucide="alert-circle" style="width: 18px; height: 18px;"></i>
                        <span th:text="${mensagemErro}">Mensagem de Erro do Java</span>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Tipo de Usuário</label>
                        <div class="grid grid-cols-2 gap-2">

                            <label class="btn btn-outline" id="btnGestor" style="cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                                <input type="radio" name="tipoUsuario" value="gestor" class="radio-escondido" onclick="marcarBotaoJava('gestor')" th:checked="${usuario?.tipoUsuario == 'gestor'}" required>
                                <i data-lucide="shield" class="icon"></i> Gestor
                            </label>

                            <label class="btn btn-outline" id="btnFuncionario" style="cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                                <input type="radio" name="tipoUsuario" value="funcionario" class="radio-escondido" onclick="marcarBotaoJava('funcionario')" th:checked="${usuario?.tipoUsuario == 'funcionario'}">
                                <i data-lucide="user" class="icon"></i> Funcionário
                            </label>

                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Nome Completo</label>
                        <input type="text" name="nomeCompletoUsuario" th:value="${usuario?.nomeCompletoUsuario}" th:classappend="${mensagemErro != null && mensagemErro.contains('nome')} ? 'input-error' : ''" class="form-input" placeholder="Seu nome completo">

                    </div>
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="text" name="email" th:value="${usuario?.email}" th:classappend="${mensagemErro != null && mensagemErro.contains('e-mail')} ? 'input-error' : ''" class="form-input" placeholder="seu@email.com">

                    </div>
                    <div class="form-group">
                        <label class="form-label">Senha</label>

                        <div style="position: relative; width: 100%;">

                            <input type="password" id="senha" name="senha" class="form-input" required style="padding-right: 40px;">

                            <button type="button" id="togglePassword"
                                    style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; padding: 0; cursor: pointer; color: var(--muted-foreground); display: flex; align-items: center;">
                                <i data-lucide="eye" style="width: 20px; height: 20px;"></i>
                            </button>
                        </div>
                    </div>
                    <div id="requisitosContainer" style="display: none;" class="card mb-3">
                        <p style="font-size: 0.875rem; font-weight: 500; margin-bottom: 0.5rem;">Requisitos da senha:</p>
                        <div style="display: flex; flex-direction: column; gap: 0.25rem;">
                            <div id="req-tamanho" style="font-size: 0.875rem; color: var(--muted-foreground);">
                                <i data-lucide="circle" class="icon" style="width: 16px; height: 16px;"></i> Mínimo 8 caracteres
                            </div>
                            <div id="req-maiuscula" style="font-size: 0.875rem; color: var(--muted-foreground);">
                                <i data-lucide="circle" class="icon" style="width: 16px; height: 16px;"></i> Letra maiúscula
                            </div>
                            <div id="req-minuscula" style="font-size: 0.875rem; color: var(--muted-foreground);">
                                <i data-lucide="circle" class="icon" style="width: 16px; height: 16px;"></i> Letra minúscula
                            </div>
                            <div id="req-numero" style="font-size: 0.875rem; color: var(--muted-foreground);">
                                <i data-lucide="circle" class="icon" style="width: 16px; height: 16px;"></i> Número
                            </div>
                            <div id="req-especial" style="font-size: 0.875rem; color: var(--muted-foreground);">
                                <i data-lucide="circle" class="icon" style="width: 16px; height: 16px;"></i> Caractere especial (!@#$%^&*)
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirmar Senha</label>
                        <div style="position: relative; width: 100%;">

                            <input type="password" id="confirmarSenha" name="confirmarSenha" class="form-input" required style="padding-right: 40px;">

                            <button type="button" id="toggleConfirmPassword"
                                    style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; padding: 0; cursor: pointer; color: var(--muted-foreground); display: flex; align-items: center;">
                                <i data-lucide="eye" style="width: 20px; height: 20px;"></i>
                            </button>
                        </div>
                    </div>
                    <div id="errorMessage" class="alert alert-error hidden"></div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Criar Conta</button>
                </form>
            </div>
        </div>
    </div>

    <script th:src="@{/js/auth.js}"></script>
    <script>
        lucide.createIcons();



        // Se a página recarregar por erro, mantém o botão que o usuário clicou ativo
        window.addEventListener('DOMContentLoaded', () => {
            const selecionado = document.querySelector('input[name="tipoUsuario"]:checked');
            if (selecionado) {
                marcarBotaoJava(selecionado.value);
            }
        });


        function marcarBotaoJava(tipo) {
            // Pega os dois elementos <label> que funcionam como botões
            const btnGestor = document.getElementById('btnGestor');
            const btnFuncionario = document.getElementById('btnFuncionario');

            // 1. Reseta ambos para o estado "desmarcado" (outline)
            btnGestor.classList.remove('btn-primary');
            btnGestor.classList.add('btn-outline');

            btnFuncionario.classList.remove('btn-primary');
            btnFuncionario.classList.add('btn-outline');

            // 2. Aplica a cor de botão "marcado" (primary) apenas ao que foi clicado
            if (tipo === 'gestor') {
                btnGestor.classList.remove('btn-outline');
                btnGestor.classList.add('btn-primary');
            } else if (tipo === 'funcionario') {
                btnFuncionario.classList.remove('btn-outline');
                btnFuncionario.classList.add('btn-primary');
            }
        }

        // 1. Função que testa as regras da senha usando Regex
        function validarSenhaForte(senha) {
            return {
                tamanho: senha.length >= 8,
                maiuscula: /[A-Z]/.test(senha), // Tem pelo menos uma letra maiúscula
                minuscula: /[a-z]/.test(senha), // Tem pelo menos uma letra minúscula
                numero: /[0-9]/.test(senha),    // Tem pelo menos um número
                especial: /[!@#$%^&*]/.test(senha) // Tem pelo menos um caractere especial
            };
        }

        // 2. O evento corrigido para lidar com a troca de ícones do Lucide
        document.getElementById('senha').addEventListener('input', function() {
            const senha = this.value;
            const container = document.getElementById('requisitosContainer');

            // Mapeamento dos textos exatos que estão no seu HTML
            const textosRequisitos = {
                tamanho: "Mínimo 8 caracteres",
                maiuscula: "Letra maiúscula",
                minuscula: "Letra minúscula",
                numero: "Número",
                especial: "Caractere especial (!@#$%^&*)"
            };

            if (senha) {
                container.style.display = 'block';
                const requisitos = validarSenhaForte(senha);

                for (const [key, value] of Object.entries(requisitos)) {
                    const elem = document.getElementById('req-' + key);

                    // Injetamos um novo <i> no HTML para que o Lucide possa convertê-lo novamente
                    if (value) {
                        elem.style.color = '#10b981'; // Verde de sucesso
                        elem.innerHTML = `<i data-lucide="check-circle" class="icon" style="width: 16px; height: 16px;"></i> ${textosRequisitos[key]}`;
                    } else {
                        elem.style.color = 'var(--muted-foreground)'; // Cor padrão
                        elem.innerHTML = `<i data-lucide="circle" class="icon" style="width: 16px; height: 16px;"></i> ${textosRequisitos[key]}`;
                    }
                }

                // Pede para o Lucide ler a tela novamente e transformar os novos <i> em <svg>
                lucide.createIcons();

            } else {
                container.style.display = 'none';
            }
        });
    </script>

</body>
</html>

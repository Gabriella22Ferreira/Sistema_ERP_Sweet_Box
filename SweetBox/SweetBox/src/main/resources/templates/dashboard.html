<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SweetBox</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="page-wrapper">
        <nav class="navbar">
            <div class="navbar-content">
                <a href="#" class="navbar-brand">
                    <div class="navbar-logo">🍬</div>
                    <div class="navbar-brand-text"><h1>SweetBox</h1><p>Sistema de Gestão</p></div>
                </a>
                <ul class="navbar-menu" id="navMenu">
                    <nav style="display: flex; justify-content: center; gap: 0.5rem; padding-top: 1rem;">

                        <a th:if="${session.usuarioLogado != null && session.usuarioLogado.tipoUsuario == 'gestor'}" th:href="@{/dashboard}" style="display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem; text-decoration: none; color: var(--foreground); border-radius: 8px; transition: background 0.2s;" onmouseover="this.style.background='rgba(0,0,0,0.05)'" onmouseout="this.style.background='transparent'">
                            <i data-lucide="layout-dashboard" style="width: 20px; height: 20px;"></i>
                            <span style="font-weight: 500;">Dashboard</span>
                        </a>

                        <a th:href="@{/vendas}" style="display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem; text-decoration: none; color: var(--foreground); border-radius: 8px; transition: background 0.2s;" onmouseover="this.style.background='rgba(0,0,0,0.05)'" onmouseout="this.style.background='transparent'">
                            <i data-lucide="shopping-cart" style="width: 20px; height: 20px;"></i>
                            <span style="font-weight: 500;">Vendas</span>
                        </a>

                        <a th:href="@{/produtos}" style="display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem; text-decoration: none; color: var(--foreground); border-radius: 8px; transition: background 0.2s;" onmouseover="this.style.background='rgba(0,0,0,0.05)'" onmouseout="this.style.background='transparent'">
                            <i data-lucide="package" style="width: 20px; height: 20px;"></i>
                            <span style="font-weight: 500;">Produtos</span>
                        </a>

                        <a th:if="${session.usuarioLogado != null && session.usuarioLogado.tipoUsuario == 'gestor'}" th:href="@{/estoque}" style="display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem; text-decoration: none; color: var(--foreground); border-radius: 8px; transition: background 0.2s;" onmouseover="this.style.background='rgba(0,0,0,0.05)'" onmouseout="this.style.background='transparent'">
                            <i data-lucide="boxes" style="width: 20px; height: 20px;"></i>
                            <span style="font-weight: 500;">Estoque</span>
                        </a>

                        <a th:if="${session.usuarioLogado != null && session.usuarioLogado.tipoUsuario == 'gestor'}" th:href="@{/cadastro}" style="display: flex; align-items: center; gap: 0.5rem; padding: 0.75rem; text-decoration: none; color: var(--foreground); border-radius: 8px; transition: background 0.2s;" onmouseover="this.style.background='rgba(0,0,0,0.05)'" onmouseout="this.style.background='transparent'">
                            <i data-lucide="boxes" style="width: 20px; height: 20px;"></i>
                            <span style="font-weight: 500;">Criar contas</span>
                        </a>


                        <hr style="border: 0; border-top: 1px solid var(--border); margin: 1rem 0;">

                    </nav>
                </ul>
                <div class="navbar-user">
                    <div class="navbar-user-info" id="userInfo">
                        <p>Gestor SweetBox</p>
                        <span th:text="${session.usuarioLogado != null ? session.usuarioLogado.nomeCompletoUsuario : 'Usuário'}">
                            Nome do Figma
                        </span>
                    </div>
                    <div class="navbar-avatar">👤</div>
                    <button class="btn-logout" th:href="@{/logout}"><i data-lucide="log-out" class="icon"></i></button>
                </div>
            </div>
        </nav>
            <main class="main-content">
            <div class="container">
                <div class="flex-between mb-4">
                    <div>
                        <h2 style="font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem;">Dashboard</h2>
                        <p style="color: var(--muted-foreground);">Visão geral da sua loja</p>
                    </div>
                    <div class="flex gap-2">
                        <a th:href="@{/dashboard(periodo='diario')}" class="btn" th:classappend="${periodo == 'diario' ? 'btn-primary' : 'btn-outline'}">Diário</a>
                        <a th:href="@{/dashboard(periodo='mensal')}" class="btn" th:classappend="${periodo == 'mensal' ? 'btn-primary' : 'btn-outline'}">Mensal</a>
                        <a th:href="@{/dashboard(periodo='anual')}" class="btn" th:classappend="${periodo == 'anual' ? 'btn-primary' : 'btn-outline'}">Anual</a>
                    </div>
                </div>

                <div class="stats-grid" id="statsCards">

                    <div class="stat-card">
                        <div class="stat-card-content">
                            <div class="stat-card-info">
                                <p>Total de Produtos</p>
                                <h3 th:text="${totalProdutos}">0</h3>
                            </div>
                            <div class="stat-card-icon" style="background: linear-gradient(135deg, var(--primary), var(--accent));">
                                <i data-lucide="package" class="icon-lg"></i>
                            </div>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-card-content">
                            <div class="stat-card-info">
                                <p>Total de Vendas</p>
                                <h3 th:text="${totalVendas}">0</h3>
                            </div>
                            <div class="stat-card-icon" style="background: linear-gradient(135deg, var(--accent), var(--secondary));">
                                <i data-lucide="shopping-cart" class="icon-lg"></i>
                            </div>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-card-content">
                            <div class="stat-card-info">
                                <p>Receita Total</p>
                                <h3>R$ <span th:text="${#numbers.formatDecimal(receitaTotal, 1, 'POINT', 2, 'COMMA')}">0,00</span></h3>
                            </div>
                            <div class="stat-card-icon" style="background: linear-gradient(135deg, var(--secondary), var(--primary));">
                                <i data-lucide="trending-up" class="icon-lg"></i>
                            </div>
                        </div>
                    </div>

                    <div class="stat-card">
                        <div class="stat-card-content">
                            <div class="stat-card-info">
                                <p>Estoque Baixo</p>
                                <h3 th:text="${estoqueBaixo}">0</h3>
                            </div>
                            <div class="stat-card-icon" style="background: linear-gradient(135deg, var(--destructive), var(--accent));">
                                <i data-lucide="alert-circle" class="icon-lg"></i>
                            </div>
                        </div>
                    </div>

                </div>

                <div class="grid grid-cols-sm-2 gap-3 mb-4">
                    <div class="card">
                        <h3 class="card-title" id="tituloVendas">Vendas</h3>
                        <canvas id="chartVendas"></canvas>
                    </div>
                    <div class="card">
                        <h3 class="card-title" id="tituloReceita">Receita</h3>
                        <canvas id="chartReceita"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/dashboard.js"></script>
    <script>lucide.createIcons(); carregarMenu();</script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        // O Thymeleaf vai injetar as Listas ou Arrays vindos do seu Controller diretamente aqui
        var labels = /*[[${labelsGrafico}]]*/ ['Seg', 'Ter', 'Qua'];
        var dadosVendas = /*[[${dadosGraficoVendas}]]*/ [10, 20, 30];
        var dadosReceita = /*[[${dadosGraficoReceita}]]*/ [100.0, 250.0, 300.0];

        // Chama a função puramente visual do seu dashboard.js assim que a tela carregar
        document.addEventListener("DOMContentLoaded", function() {
            if (typeof renderizarGraficos === "function") {
                renderizarGraficos(labels, dadosVendas, dadosReceita);
            }
            lucide.createIcons(); // Inicializa os ícones do Lucide perfeitamente
        });
        /*]]>*/
    </script>

</body>
</html>
